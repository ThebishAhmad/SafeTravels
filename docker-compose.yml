version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: safetravels-db
    environment:
      POSTGRES_USER: safetravels
      POSTGRES_PASSWORD: password
      POSTGRES_DB: safetravels
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: safetravels-cache
    ports:
      - "6379:6379"

volumes:
  pgdata:
